<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="grad-demo_4.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.35)" />
    </filter>
  </defs>

  <!-- Polaroid Frame -->
  <rect x="20" y="20" width="460" height="460" rx="16" fill="#fdfbf7" filter="url(#shadow)" stroke="rgba(255,209,102,0.4)" stroke-width="2" />
  
  <!-- Photo Inner Canvas -->
  <rect x="40" y="40" width="420" height="340" rx="10" fill="url(#grad-demo_4.svg)" />
  
  <!-- Subtle decorative stars -->
  <circle cx="90" cy="80" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="390" cy="90" r="4" fill="#ffd166" opacity="0.9" />
  <circle cx="410" cy="320" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="80" cy="310" r="2" fill="#ffd166" opacity="0.7" />

  <!-- Center Icon & Glow -->
  <circle cx="250" cy="200" r="64" fill="rgba(255,255,255,0.18)" />
  <text x="250" y="222" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="64" text-anchor="middle">🌸</text>

  <!-- Photo Banner Tape -->
  <rect x="180" y="28" width="140" height="24" rx="4" fill="rgba(255,255,255,0.65)" transform="rotate(-2 250 40)" />

  <!-- Polaroid Caption -->
  <text x="250" y="415" font-family="'Be Vietnam Pro', 'Montserrat', sans-serif" font-weight="bold" font-size="20" fill="#1e1e24" text-anchor="middle">Những Bông Hoa 11A2 🌸</text>
  <text x="250" y="440" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#666677" text-anchor="middle">Xinh tươi, dịu dàng và luôn tỏa sáng</text>
</svg>